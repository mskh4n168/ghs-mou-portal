{% extends "base.html" %}
{% block title %}Log in{% endblock %}
{% block wrapclass %}narrow{% endblock %}
{% block content %}
<div class="card">
    <h1>Log in</h1>
    <p class="lead">Sign in to submit or review your region's MOU.</p>
    <form method="post" action="{{ url_for('login') }}">
        <input type="hidden" name="_csrf" value="{{ csrf_token() }}">
        <div class="field">
            <label for="email">Email</label>
            <input class="input" id="email" type="email" name="email" value="{{ email or '' }}" required autofocus>
        </div>
        <div class="field">
            <label for="password">Password</label>
            <input class="input" id="password" type="password" name="password" required>
        </div>
        <div class="actions">
            <button class="btn" type="submit">Log in</button>
            <a class="muted" href="{{ url_for('register') }}">Need an account? Register</a>
        </div>
    </form>
</div>
{% endblock %}
